modLoader="javafml"
loaderVersion="${fml_range}"
license="GPL-3.0-or-later"
issueTrackerURL="https://github.com/JoshuaMEtaylor/Quidoms/issues"

[[mods]]
modId="minecolonies"
version="${version}"
displayName="Quidoms"
displayURL="https://github.com/JoshuaMEtaylor/Quidoms"
logoFile="minecolonies_logo.png"
credits="Based on MineColonies by LDT Team (GPL-3.0). Quidoms fork changes: no raids, unbreakable any-tier colonist tools, ingredient BOM builds."
authors="JoshuaMEtaylor; LDT Team (upstream MineColonies)"
description='''
Quidoms is a colony simulator for NeoForge based on the full MineColonies codebase (LDT Team, GPL-3.0).

Quidoms product changes on top of upstream:
- Raids removed (never scheduled).
- Colonist tools are unbreakable and ignore hut/citizen tool-level gates (player-equivalent stats/enchants kept).
- Building material lists expand to recursive crafting ingredients where recipes allow.

LDT libraries (Structurize, BlockUI, Domum Ornamentum, MultiPiston) are nested via NeoForge Jar-in-Jar.
Target: NeoForge / Minecraft 1.21.10. Nested dep bytecode is currently from the 1.21.1 LDT line.
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.minecolonies]]
    modId="neoforge"
    type="required"
    versionRange="[${forgeMinVersion}, )"
    ordering="NONE"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="structurize"
    type="required"
    versionRange="[${structurize_version}, )"
    ordering="AFTER"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="blockui"
    type="required"
    versionRange="[${blockUI_version}, )"
    ordering="AFTER"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="domum_ornamentum"
    type="required"
    versionRange="[${domumOrnamentumVersion}, )"
    ordering="AFTER"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="journeymap"
    type="optional"
    versionRange="[${jmapVersion},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.minecolonies]]
    modId="dynamictrees"
    type="optional"
    versionRange="[${dynamicTreesVersion},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minecolonies]]
    modId="multipiston"
    type="required"
    versionRange="[1.2.58-1.21.1, )"
    ordering="AFTER"
    side="BOTH"
