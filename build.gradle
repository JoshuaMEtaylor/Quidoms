plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'quidoms'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Vendored LDT libraries compiled into Quidoms for NeoForge 1.21.10.
def vendorMods = [
    file('vendor/blockui/src/main/java'),
    file('vendor/structurize/src/main/java'),
    file('vendor/Domum-Ornamentum/src/api/java'),
    file('vendor/Domum-Ornamentum/src/main/java'),
    file('vendor/multipiston/src/main/java'),
]
def vendorResources = [
    file('vendor/blockui/src/main/resources'),
    file('vendor/structurize/src/main/resources'),
    file('vendor/Domum-Ornamentum/src/main/resources'),
    file('vendor/Domum-Ornamentum/src/api/resources'),
    file('vendor/multipiston/src/main/resources'),
]

sourceSets.main.java {
    srcDirs(vendorMods.findAll { it.exists() })
    // Datagen / recipe providers need ExistingFileHelper etc. — skip for game jar
    exclude '**/datagen/**'
    exclude '**/generation/**'
    exclude '**/GatherDataHandler.java'
    // Domum pieces still on pre-1.21.10 client model / network APIs
    exclude '**/domumornamentum/event/handlers/ModBusEventHandler.java'
    exclude '**/domumornamentum/client/event/handlers/ModBusEventHandler.java'
    exclude '**/domumornamentum/client/event/handlers/MateriallyTexturedBlockPreviewRenderHandler.java'
    exclude '**/domumornamentum/client/render/ModRenderTypes.java'
    exclude '**/domumornamentum/client/render/ModelGhostRenderer.java'
    exclude '**/domumornamentum/client/model/baked/**'
    exclude '**/domumornamentum/client/model/geometry/**'
    exclude '**/domumornamentum/client/model/loader/MateriallyTexturedModelLoader.java'
    exclude '**/domumornamentum/client/model/utils/ModelSpriteQuadTransformer.java'
    exclude '**/domumornamentum/jei/**'
    exclude '**/domumornamentum/network/IServerboundDistributor.java'
}


sourceSets.main.resources {
    srcDirs(vendorResources.findAll { it.exists() })
    // Prefer Quidoms mods.toml / AT over vendor copies
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
    exclude 'pack.mcmeta'
    exclude '**/datagen/**'
    exclude '**/.cache/**'
}

repositories {
    maven { url = 'https://ldtteam.jfrog.io/ldtteam/modding/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://jm.gserv.me/repository/maven-public/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        minecolonies {
            sourceSet(sourceSets.main)
        }
        structurize {
            sourceSet(sourceSets.main)
        }
        blockui {
            sourceSet(sourceSets.main)
        }
        domum_ornamentum {
            sourceSet(sourceSets.main)
        }
        multipiston {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional compat — compileOnly so missing 1.21.10 artifacts do not fail the build
    compileOnly "mezz.jei:jei-${project.jei_mcversion}-neoforge-api:${project.jei_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${project.jmapApiVersion}"
    if (project.hasProperty('dynamicTreesVersion')) {
        compileOnly("com.dtteam.dynamictrees:dynamictrees-neoforge-${project.dynamicTreesMcVersion}:${project.dynamicTreesVersion}") {
            transitive = false
        }
    }
    // LDT datagen helpers used by Domum / Structurize when present
    compileOnly("com.ldtteam:datagenerators:${project.dataGeneratorsVersion}:universal") {
        transitive = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        minecraft_range        : minecraft_range,
        neo_version            : neo_version,
        forgeMinVersion        : forgeMinVersion,
        forgeVersion           : forgeVersion,
        fml_range              : fml_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        version                : mod_version,
        structurize_version    : structurize_version,
        blockUI_version        : blockUI_version,
        domumOrnamentumVersion : domumOrnamentumVersion,
        multiPistonVersion     : multiPistonVersion,
        jei_version            : jei_version,
        jmapVersion            : jmapVersion,
        dynamicTreesVersion    : dynamicTreesVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copy the primary jar into dist/ after build
tasks.register('copyDist', Copy) {
    dependsOn jar
    from jar.archiveFile
    into layout.projectDirectory.dir('dist')
    rename { "quidoms-${mod_version}.jar" }
}

tasks.named('build').configure {
    finalizedBy copyDist
}
