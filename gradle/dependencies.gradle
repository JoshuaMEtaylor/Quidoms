dependencies {
    def localStructurize = file("libs/jij/structurize-1.0.832-1.21.1.jar")
    def localBlockui = file("libs/jij/blockui-1.0.212-1.21.1-snapshot.jar")
    def localDomum = file("libs/jij/domum_ornamentum-1.21-1.0.193-BETA.jar")
    def localMultipiston = file("libs/jij/multipiston-1.2.58-1.21.1.jar")

    implementation files(localStructurize, localBlockui, localDomum, localMultipiston)

    implementation ("com.ldtteam:datagenerators:${project.dataGeneratorsVersion}:universal") {
        transitive = false
    }

    compileOnly "mezz.jei:jei-${project.jei_mcversion}-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.jei_mcversion}-neoforge:${project.jei_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${project.jmapApiVersion}"

    if (project.hasProperty("dynamicTreesVersion")) {
        compileOnly ("com.dtteam.dynamictrees:dynamictrees-neoforge-${project.dynamicTreesMcVersion}:${project.dynamicTreesVersion}") {
            transitive = false
        }
    }
}
